<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>もふもふごまタッチ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    background:linear-gradient(180deg,#fff5e6,#ffe9f0);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:16px; color:#5a4632; user-select:none; -webkit-user-select:none;
    touch-action:manipulation; overflow-x:hidden;
  }
  h1 { font-size:26px; margin:10px 0 2px; letter-spacing:.02em; }
  .sub { font-size:13px; color:#a07c5b; margin-bottom:12px; }
  .hud { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; justify-content:center; }
  .hud div { background:#fff; border-radius:999px; padding:6px 16px; font-weight:bold; box-shadow:0 2px 6px rgba(0,0,0,.08); font-size:15px; }
  .timerbar { width:min(92vw,420px); height:10px; background:#fff; border-radius:999px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.12); margin-bottom:14px; }
  .timerbar > div { height:100%; width:100%; background:linear-gradient(90deg,#ffb3c7,#ffcf87); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:min(92vw,420px); }
  .cell { position:relative; aspect-ratio:1/1; background:#fffdf8; border-radius:24px; box-shadow:0 3px 8px rgba(0,0,0,.07); overflow:hidden; }
  .hole { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); width:64%; height:18%; background:#e8d5bd; border-radius:50%; }
  .goma { position:absolute; left:50%; bottom:4px; width:74%; transform:translate(-50%,115%); transition:transform .16s ease-out; cursor:pointer; }
  .goma.up { transform:translate(-50%,0); }
  .goma svg { display:block; width:100%; height:auto; pointer-events:none; }
  button {
    margin-top:18px; background:#ff9eb5; color:#fff; border:none; font-size:18px; font-weight:bold;
    padding:12px 36px; border-radius:999px; box-shadow:0 4px 0 #e87f98; cursor:pointer;
    font-family:inherit;
  }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #e87f98; }
  .msg { margin-top:12px; font-size:15px; min-height:22px; font-weight:bold; text-align:center; }
  .particle { position:fixed; width:10px; height:10px; border-radius:50%; pointer-events:none; z-index:99; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  .shake { animation:shake .18s ease-in-out 1; }
</style>
</head>
<body>
  <h1>もふもふごまタッチ</h1>
  <div class="sub">出てきたごまをタップ！ 金のごまは5点だよ</div>
  <div class="hud">
    <div>スコア <span id="score">0</span></div>
    <div>ベスト <span id="best">0</span></div>
    <div>残り <span id="time">30</span>秒</div>
  </div>
  <div class="timerbar"><div id="bar"></div></div>
  <div class="grid" id="grid"></div>
  <button id="startBtn">スタート</button>
  <div class="msg" id="msg">ボタンを押してね</div>

<script>
  const grid = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const timeEl = document.getElementById('time');
  const barEl = document.getElementById('bar');
  const msgEl = document.getElementById('msg');
  const startBtn = document.getElementById('startBtn');

  function faceSVG(gold) {
    const body = gold ? '#ffd94d' : '#f7e8c9';
    const earIn = gold ? '#ffb3c7' : '#f5b8c4';
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="24" cy="26" r="15" fill="' + body + '"/>' +
      '<circle cx="76" cy="26" r="15" fill="' + body + '"/>' +
      '<circle cx="24" cy="26" r="7" fill="' + earIn + '"/>' +
      '<circle cx="76" cy="26" r="7" fill="' + earIn + '"/>' +
      '<circle cx="50" cy="56" r="38" fill="' + body + '"/>' +
      '<ellipse cx="30" cy="62" rx="6" ry="4" fill="#f5a3b7" opacity="0.7"/>' +
      '<ellipse cx="70" cy="62" rx="6" ry="4" fill="#f5a3b7" opacity="0.7"/>' +
      '<ellipse cx="38" cy="52" rx="4" ry="6" fill="#3a2c1c"/>' +
      '<ellipse cx="62" cy="52" rx="4" ry="6" fill="#3a2c1c"/>' +
      '<circle cx="39.5" cy="49.5" r="1.6" fill="#fff"/>' +
      '<circle cx="63.5" cy="49.5" r="1.6" fill="#fff"/>' +
      '<path d="M45 64 Q50 69 55 64" stroke="#3a2c1c" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
      '</svg>';
  }

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const hole = document.createElement('div');
    hole.className = 'hole';
    const goma = document.createElement('div');
    goma.className = 'goma';
    goma.innerHTML = faceSVG(false);
    goma.dataset.type = 'normal';
    cell.appendChild(hole);
    cell.appendChild(goma);
    grid.appendChild(cell);
    cells.push({ goma: goma, up: false, hideTimer: null });
    goma.addEventListener('pointerdown', function (e) { tapGoma(i, e); });
  }

  let score = 0;
  let best = parseInt(localStorage.getItem('goma-best') || '0', 10);
  let playing = false;
  let timeLeft = 30;
  let spawnTimer = null;
  let tickTimer = null;
  bestEl.textContent = best;

  function spawn() {
    if (!playing) return;
    const down = cells.filter(function (c) { return !c.up; });
    if (down.length > 0) {
      const c = down[Math.floor(Math.random() * down.length)];
      const gold = Math.random() < 0.15;
      c.goma.innerHTML = faceSVG(gold);
      c.goma.dataset.type = gold ? 'gold' : 'normal';
      c.up = true;
      c.goma.classList.add('up');
      const stay = 720 + Math.random() * 260;
      c.hideTimer = setTimeout(function () { hide(c); }, stay);
    }
    const gap = 380 + Math.random() * 320 - (30 - timeLeft) * 6;
    spawnTimer = setTimeout(spawn, Math.max(300, gap));
  }

  function hide(c) {
    c.up = false;
    c.goma.classList.remove('up');
    if (c.hideTimer) { clearTimeout(c.hideTimer); c.hideTimer = null; }
  }

  function burst(x, y, gold) {
    const colors = gold ? ['#ffd94d', '#ffb703', '#fff3b0'] : ['#ffb3c7', '#ffcf87', '#f7e8c9'];
    for (let i = 0; i < 10; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.background = colors[i % colors.length];
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      document.body.appendChild(p);
      const ang = Math.random() * Math.PI * 2;
      const dist = 34 + Math.random() * 46;
      p.animate([
        { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
        { transform: 'translate(' + (Math.cos(ang) * dist - 5) + 'px,' + (Math.sin(ang) * dist - 5) + 'px) scale(0.3)', opacity: 0 }
      ], { duration: 420 + Math.random() * 180, easing: 'ease-out' }).onfinish = (function (el) { return function () { el.remove(); }; })(p);
    }
  }

  function tapGoma(i, e) {
    const c = cells[i];
    if (!playing || !c.up) return;
    const gold = c.goma.dataset.type === 'gold';
    score += gold ? 5 : 1;
    scoreEl.textContent = score;
    burst(e.clientX, e.clientY, gold);
    if (gold) {
      grid.classList.remove('shake');
      void grid.offsetWidth;
      grid.classList.add('shake');
      msgEl.textContent = '金のごま！ +5点';
    }
    hide(c);
  }

  function start() {
    if (playing) return;
    cells.forEach(hide);
    score = 0;
    scoreEl.textContent = '0';
    timeLeft = 30;
    timeEl.textContent = '30';
    barEl.style.width = '100%';
    playing = true;
    startBtn.textContent = 'がんばって！';
    startBtn.disabled = true;
    msgEl.textContent = 'ごまをタップしてね';
    spawn();
    tickTimer = setInterval(function () {
      timeLeft -= 0.1;
      if (timeLeft <= 0) {
        timeLeft = 0;
        end();
      }
      timeEl.textContent = Math.ceil(timeLeft);
      barEl.style.width = (timeLeft / 30 * 100) + '%';
    }, 100);
  }

  function end() {
    playing = false;
    clearInterval(tickTimer);
    clearTimeout(spawnTimer);
    cells.forEach(hide);
    if (score > best) {
      best = score;
      localStorage.setItem('goma-best', String(best));
      bestEl.textContent = best;
      msgEl.textContent = 'おしまい！ 新記録 ' + score + '点！';
    } else {
      msgEl.textContent = 'おしまい！ ' + score + '点だったよ';
    }
    startBtn.textContent = 'もう一回';
    startBtn.disabled = false;
  }

  startBtn.addEventListener('click', start);
</script>
</body>
</html>
